<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.jpg" type="image/jpeg">
<title>おさがりシェアリング｜てぃあんだぁクラブ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Zen Maru Gothic', sans-serif;
    background: #F5EFE6;
    color: #2a2a2a;
    line-height: 1.7;
  }
  header {
    background: #91BD5A;
    color: #fff;
    padding: 20px 16px;
    text-align: center;
    position: relative;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
  .admin-link {
    position: absolute;
    top: 10px;
    right: 14px;
    color: #fff;
    opacity: 0.7;
    font-size: 1.1rem;
    text-decoration: none;
    line-height: 1;
  }
  .admin-link:hover { opacity: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .status-msg { text-align: center; padding: 40px 16px; color: #666; }
  .item-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .item-card {
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .item-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #eee;
    display: block;
  }
  .item-card .info { min-width: 0; padding: 10px; }
  .item-card .name {
    font-weight: bold;
    margin: 0 0 4px;
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .item-card .meta { font-size: 0.78rem; color: #666; margin: 0; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    border-radius: 6px;
    padding: 1px 8px;
    margin-top: 4px;
  }
  .register-link {
    display: inline-block;
    margin-top: 10px;
    background: #fff;
    color: #507131;
    font-weight: bold;
    font-size: 0.8rem;
    text-decoration: none;
    padding: 7px 16px;
    border-radius: 20px;
  }
  .cat-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .cat-tab {
    flex: 1; text-align: center; padding: 9px 6px; border-radius: 8px;
    background: #fff; border: 1.5px solid #ddd; font-size: 0.8rem; font-weight: bold;
    color: #666; cursor: pointer;
  }
  .cat-tab.on { border-color: #91BD5A; background: #EAF5D3; color: #507131; }
</style>
</head>
<body>
<header>
  <a class="admin-link" href="https://docs.google.com/spreadsheets/d/1ATUAMkRrnC5QbY_AjXlHkLiVguYewqjEYSvvAg1kLRw/edit?gid=816451320#gid=816451320" target="_blank" title="管理者用スプレッドシート（担当者のみ）">⚙️</a>
  <h1>🛋️ おさがりシェアリング</h1>
  <p>会員のあいだで、モノや「たすけあい」を次の人へつなぐ場所です</p>
  <a class="register-link" href="register.html">＋ 登録する</a>
</header>
<main>
  <div class="cat-tabs">
    <div class="cat-tab on" data-cat="all" onclick="filterCat('all')">すべて</div>
    <div class="cat-tab" data-cat="モノ" onclick="filterCat('モノ')">🛋️ モノ</div>
    <div class="cat-tab" data-cat="たすけあい" onclick="filterCat('たすけあい')">🤝 たすけあい</div>
  </div>
  <div id="status" class="status-msg">読み込み中です…</div>
  <div id="list" class="item-list"></div>
</main>

<script>
let ALL_ITEMS = [];
let CURRENT_CAT = 'all';

async function loadItems() {
  const statusEl = document.getElementById('status');
  try {
    const res = await fetch('/osagari/api/items', { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok || data.error) {
      statusEl.textContent = data.error || '読み込みに失敗しました。時間をおいて再度お試しください。';
      return;
    }
    ALL_ITEMS = data.items || [];
    if (ALL_ITEMS.length === 0) {
      statusEl.textContent = '現在、掲載中のおさがり・たすけあいはありません。';
      return;
    }
    statusEl.style.display = 'none';
    renderList();
  } catch (e) {
    statusEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
  }
}

function itemCat(item) {
  // 分類列に「たすけあい」を含む値が入っていれば、たすけあいカテゴリとして扱う
  const raw = item['分類'] || '';
  return raw.indexOf('たすけあい') !== -1 ? 'たすけあい' : 'モノ';
}

function filterCat(cat) {
  CURRENT_CAT = cat;
  document.querySelectorAll('.cat-tab').forEach(el => {
    el.classList.toggle('on', el.dataset.cat === cat);
  });
  renderList();
}

function renderList() {
  const listEl = document.getElementById('list');
  const statusEl = document.getElementById('status');
  const items = CURRENT_CAT === 'all' ? ALL_ITEMS : ALL_ITEMS.filter(i => itemCat(i) === CURRENT_CAT);
  if (items.length === 0) {
    listEl.innerHTML = '';
    statusEl.style.display = 'block';
    statusEl.textContent = '該当する掲載はありません。';
    return;
  }
  statusEl.style.display = 'none';
  listEl.innerHTML = items.map(renderCard).join('');
}

function proxyImageUrl(rawUrl) {
  // drive.google.com等を直接埋め込むと広告ブロッカー等にブロックされることがあるため、
  // 常に自サイト（tea-under.club）経由のWorkers中継URLに書き換える
  return rawUrl ? '/osagari/api/image?src=' + encodeURIComponent(rawUrl) : '';
}

const STATUS_COLORS = {
  '受付中': { bg: '#91BD5A', fg: '#fff' },
  '要確認': { bg: '#F9C733', fg: '#5c4b00' },
  '終了': { bg: '#999', fg: '#fff' },
};

function statusBadge(status) {
  if (!status) return '';
  const c = STATUS_COLORS[status] || { bg: '#91BD5A', fg: '#fff' };
  return `<span class="badge" style="background:${c.bg};color:${c.fg}">${escapeHtml(status)}</span>`;
}

function renderCard(item) {
  const img = proxyImageUrl(item['画像URL']);
  const name = escapeHtml(item['商品名'] || '(名称未設定)');
  const area = escapeHtml(item['地域'] || '');
  const status = item['掲載状況'] || '';
  const cat = itemCat(item);
  const catBadge = cat === 'たすけあい'
    ? `<span class="badge" style="background:#F9C733;color:#5c4b00;">🤝 たすけあい</span>`
    : '';
  const imgTag = img
    ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
    : `<div style="width:100%;aspect-ratio:1/1;background:#eee;display:flex;align-items:center;justify-content:center;font-size:2em;">${cat === 'たすけあい' ? '🤝' : '🛋️'}</div>`;
  return `
    <a class="item-card" href="item.html?id=${encodeURIComponent(item['商品ID'])}">
      ${imgTag}
      <div class="info">
        <p class="name">${name}</p>
        <p class="meta">${area}</p>
        ${catBadge}
        ${statusBadge(status)}
      </div>
    </a>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

loadItems();
</script>
</body>
</html>
