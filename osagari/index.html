<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おさがりシェアリング｜てぃあんだぁクラブ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Zen Maru Gothic', sans-serif;
    background: #F5EFE6;
    color: #2a2a2a;
    line-height: 1.7;
  }
  header {
    background: #91BD5A;
    color: #fff;
    padding: 20px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 4px 0 0; font-size: 0.85rem; opacity: 0.9; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .status-msg { text-align: center; padding: 40px 16px; color: #666; }
  .item-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .item-card {
    display: flex;
    flex-direction: column;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .item-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    background: #eee;
    display: block;
  }
  .item-card .info { min-width: 0; padding: 10px; }
  .item-card .name {
    font-weight: bold;
    margin: 0 0 4px;
    font-size: 0.9rem;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .item-card .meta { font-size: 0.78rem; color: #666; margin: 0; }
  .badge {
    display: inline-block;
    font-size: 0.7rem;
    border-radius: 6px;
    padding: 1px 8px;
    margin-top: 4px;
  }
</style>
</head>
<body>
<header>
  <h1>🛋️ おさがりシェアリング</h1>
  <p>会員のあいだで、モノを次の人へつなぐ場所です</p>
</header>
<main>
  <div id="status" class="status-msg">読み込み中です…</div>
  <div id="list" class="item-list"></div>
</main>

<script>
async function loadItems() {
  const statusEl = document.getElementById('status');
  const listEl = document.getElementById('list');
  try {
    const res = await fetch('/osagari/api/items', { credentials: 'same-origin' });
    const data = await res.json();
    if (!res.ok || data.error) {
      statusEl.textContent = data.error || '読み込みに失敗しました。時間をおいて再度お試しください。';
      return;
    }
    const items = data.items || [];
    if (items.length === 0) {
      statusEl.textContent = '現在、掲載中のおさがりはありません。';
      return;
    }
    statusEl.style.display = 'none';
    listEl.innerHTML = items.map(renderCard).join('');
  } catch (e) {
    statusEl.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
  }
}

function proxyImageUrl(rawUrl) {
  // drive.google.com等を直接埋め込むと広告ブロッカー等にブロックされることがあるため、
  // 常に自サイト（tea-under.club）経由のWorkers中継URLに書き換える
  return rawUrl ? '/osagari/api/image?src=' + encodeURIComponent(rawUrl) : '';
}

const STATUS_COLORS = {
  '受付中': { bg: '#91BD5A', fg: '#fff' },
  '要確認': { bg: '#F9C733', fg: '#5c4b00' },
  '終了': { bg: '#999', fg: '#fff' },
};

function statusBadge(status) {
  if (!status) return '';
  const c = STATUS_COLORS[status] || { bg: '#91BD5A', fg: '#fff' };
  return `<span class="badge" style="background:${c.bg};color:${c.fg}">${escapeHtml(status)}</span>`;
}

function renderCard(item) {
  const img = proxyImageUrl(item['画像URL']);
  const name = escapeHtml(item['商品名'] || '(名称未設定)');
  const area = escapeHtml(item['地域'] || '');
  const status = item['掲載状況'] || '';
  const imgTag = img
    ? `<img src="${escapeHtml(img)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
    : `<div style="width:100%;aspect-ratio:1/1;background:#eee;"></div>`;
  return `
    <a class="item-card" href="item.html?id=${encodeURIComponent(item['商品ID'])}">
      ${imgTag}
      <div class="info">
        <p class="name">${name}</p>
        <p class="meta">${area}</p>
        ${statusBadge(status)}
      </div>
    </a>
  `;
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

loadItems();
</script>
</body>
</html>
