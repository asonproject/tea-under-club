<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>困のアニメーション</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #faf6ef;
    font-family: "Noto Sans JP", sans-serif;
  }

  .stage {
    position: relative;
    width: 320px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .frame {
    position: relative;
    width: 200px;
    height: 200px;
    border: 10px solid #5a4632;
    border-radius: 8px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: width 0.6s ease, height 0.6s ease, border-color 0.3s ease;
  }

  .tree {
    font-weight: bold;
    color: #5a4632;
    line-height: 1;
    font-size: 8px;
    transition: font-size 0.6s ease, opacity 0.6s ease;
  }

  .caption {
    margin-top: 24px;
    color: #888;
    font-size: 14px;
    text-align: center;
  }

  .step {
    font-size: 18px;
    color: #5a4632;
    font-weight: bold;
    margin-bottom: 4px;
  }

  .toggle-btn {
    margin-top: 20px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: bold;
    color: #fff;
    background: #5a4632;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .toggle-btn:active {
    background: #c0392b;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(3px); }
  }
  .frame.bump {
    animation: shake 0.35s ease;
    border-color: #c0392b;
  }

  .watering-can {
    position: absolute;
    top: 20px;
    right: 40px;
    font-size: 44px;
    opacity: 0;
    transform: rotate(0deg);
    transform-origin: 70% 70%;
  }
  .watering-can.active {
    animation: tilt 1.2s ease forwards;
  }
  @keyframes tilt {
    0%   { opacity: 0; transform: rotate(0deg); }
    15%  { opacity: 1; }
    45%  { transform: rotate(-35deg); }
    80%  { transform: rotate(-35deg); opacity: 1; }
    100% { transform: rotate(0deg); opacity: 0; }
  }

  .water-drop {
    position: absolute;
    font-size: 20px;
    opacity: 0;
  }
  .water-drop-1 { top: 58px; right: 140px; }
  .water-drop-2 { top: 58px; right: 120px; font-size: 16px; }
  .water-drop-3 { top: 58px; right: 105px; font-size: 14px; }

  .water-drop-1.active { animation: drop 1s ease-in 0.35s forwards; }
  .water-drop-2.active { animation: drop 1s ease-in 0.55s forwards; }
  .water-drop-3.active { animation: drop 1s ease-in 0.75s forwards; }

  @keyframes drop {
    0%   { opacity: 0; transform: translateY(0) scale(0.7); }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(70px) scale(1); }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="frame" id="frame">
    <div class="tree" id="tree">🌲</div>
  </div>
  <div class="watering-can" id="wateringCan">🚿</div>
  <div class="water-drop water-drop-1" id="waterDrop1">💧</div>
  <div class="water-drop water-drop-2" id="waterDrop2">💧</div>
  <div class="water-drop water-drop-3" id="waterDrop3">💧</div>
</div>

<div class="caption" id="caption">
  <div class="step" id="step">枠だけ</div>
  タップして進める
</div>

<button class="toggle-btn" id="modeBtn">木 文字に切替</button>

<script>
  const frame = document.getElementById('frame');
  const tree = document.getElementById('tree');
  const stage = document.getElementById('stage');
  const stepLabel = document.getElementById('step');
  const caption = document.getElementById('caption');
  const modeBtn = document.getElementById('modeBtn');
  const wateringCan = document.getElementById('wateringCan');
  const waterDrops = [
    document.getElementById('waterDrop1'),
    document.getElementById('waterDrop2'),
    document.getElementById('waterDrop3'),
  ];

  // 文字モード: 5ステップ
  const kanjiStates = [
    { frame: 200, tree: 0,   opacity: 0, label: '枠だけ' },
    { frame: 200, tree: 28,  opacity: 1, label: '① 小さな木が出現' },
    { frame: 200, tree: 130, opacity: 1, label: '② 育って「困」' },
    { frame: 200, tree: 200, opacity: 1, label: '③ 囲いにぶつかる!' },
    { frame: 260, tree: 220, opacity: 1, label: '④ 囲いが広がる' },
  ];

  // 絵文字モード: 水やりステップ入りの6ステップ
  const emojiStates = [
    { frame: 200, tree: 0,   opacity: 0, label: '枠だけ',          water: false },
    { frame: 200, tree: 28,  opacity: 1, label: '① 小さな木が出現', water: false },
    { frame: 200, tree: 28,  opacity: 1, label: '② 水をあげる',     water: true  },
    { frame: 200, tree: 130, opacity: 1, label: '③ 育って「困」',   water: false },
    { frame: 200, tree: 200, opacity: 1, label: '④ 囲いにぶつかる!', water: false },
    { frame: 260, tree: 220, opacity: 1, label: '⑤ 囲いが広がる',   water: false },
  ];

  let current = 0;
  let mode = 'emoji'; // 'kanji' or 'emoji'

  function getStates() {
    return mode === 'kanji' ? kanjiStates : emojiStates;
  }

  function render() {
    const states = getStates();
    const s = states[current];

    frame.style.width = s.frame + 'px';
    frame.style.height = s.frame + 'px';
    tree.style.fontSize = s.tree + 'px';
    tree.style.opacity = s.opacity;
    stepLabel.textContent = s.label;
    tree.textContent = mode === 'kanji' ? '木' : '🌲';
    caption.style.display = mode === 'kanji' ? 'block' : 'none';

    // ぶつかる演出(最後から2番目のステップ)
    if (current === states.length - 2) {
      frame.classList.remove('bump');
      void frame.offsetWidth;
      frame.classList.add('bump');
    } else {
      frame.classList.remove('bump');
    }

    // 水やり演出
    if (s.water) {
      wateringCan.classList.remove('active');
      void wateringCan.offsetWidth;
      wateringCan.classList.add('active');
      waterDrops.forEach(drop => {
        drop.classList.remove('active');
        void drop.offsetWidth;
        drop.classList.add('active');
      });
    } else {
      wateringCan.classList.remove('active');
      waterDrops.forEach(drop => drop.classList.remove('active'));
    }
  }

  stage.addEventListener('click', () => {
    const states = getStates();
    current = (current + 1) % states.length;
    render();
  });

  modeBtn.addEventListener('click', () => {
    mode = mode === 'kanji' ? 'emoji' : 'kanji';
    modeBtn.textContent = mode === 'kanji' ? '🌲 絵文字に切替' : '木 文字に切替';
    current = 0; // モード切替時は最初の状態に戻す
    render();
  });

  render();
</script>

</body>
</html>
